<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gittohabu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        margin: 0;
        background: #0d1117;
        color: #c9d1d9;
      }

      .popup {
        width: 280px;
        padding: 16px;
        box-sizing: border-box;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      .status-pill {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #238636;
        color: #ffffff;
      }

      .status-pill.is-off {
        background: #30363d;
        color: #8b949e;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #161b22;
        margin-bottom: 12px;
      }

      .toggle-label {
        font-size: 14px;
      }

      .switch {
        position: relative;
        width: 42px;
        height: 22px;
      }

      .switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      .switch input:focus-visible + .slider {
        outline: 2px solid #58a6ff;
        outline-offset: 2px;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #30363d;
        border-radius: 999px;
        transition: 0.2s;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 2px;
        top: 2px;
        background: #8b949e;
        border-radius: 50%;
        transition: 0.2s;
      }

      .switch input:checked + .slider {
        background: #238636;
      }

      .switch input:checked + .slider::before {
        transform: translateX(20px);
        background: #ffffff;
      }

      .status-text {
        font-size: 13px;
        color: #8b949e;
      }

      .button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #21262d;
        color: #c9d1d9;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .button:hover {
        background: #30363d;
      }

      .button-primary {
        background: #238636;
        border-color: #238636;
        color: #ffffff;
      }

      .button-primary:hover {
        background: #2ea043;
        border-color: #2ea043;
      }

      .button-primary:disabled {
        background: #21262d;
        border-color: #30363d;
        color: #8b949e;
        cursor: not-allowed;
      }

      .button-row {
        display: flex;
        gap: 8px;
      }

      .button-row .button {
        flex: 1;
      }

      .spacer {
        height: 12px;
      }
    </style>
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1 class="title">Gittohabu</h1>
        <span id="status-pill" class="status-pill">ON</span>
      </header>
      <div class="toggle-row">
        <span class="toggle-label">拡張機能</span>
        <label class="switch">
          <input
            id="enabled-toggle"
            type="checkbox"
            aria-label="拡張機能の有効/無効切り替え"
          />
          <span class="slider"></span>
        </label>
      </div>
      <div class="status-text" id="status-text">有効</div>
      <div class="spacer"></div>
      <button
        id="hot-reload"
        class="button button-primary"
        type="button"
        aria-label="ページの置換を再読み込み"
      >
        🔄 再読み込み
      </button>
      <div class="spacer"></div>
      <button id="open-options" class="button" type="button">設定を開く</button>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
